plugins {
    id 'com.android.application'
}

android {
    namespace 'id.tabungansiswa.app'
    compileSdk 35

    defaultConfig {
        applicationId "id.tabungansiswa.app"
        minSdk 26
        targetSdk 35

        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('tabungan-siswa-key.jks')

            storePassword System.getenv('STORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }

        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
